# Run once, then delete this workflow file and its run logs after secrets are created.
name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore studyplan.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias studyplan \
            -storepass studyplan123 \
            -keypass studyplan123 \
            -dname "CN=Study Plan, OU=Dev, O=Personal, C=PK"

      - name: Upload Keystore Artifact
        uses: actions/upload-artifact@v6
        with:
          name: studyplan-keystore
          path: studyplan.jks
          retention-days: 90
